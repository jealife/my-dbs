server.port=8080
spring.classformat.ignore=true

# Absolute path to uploads — prevents "Fichier introuvable" when the JVM working directory
# is not the backend module root (e.g. when launched from the project root).
app.storage.local.base-dir=/Volumes/Lenovo PS8/DBS/my-dbs-master/my-school-main (2)/backend/uploads

spring.datasource.url=jdbc:mysql://localhost:3306/mydbs_dbb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true